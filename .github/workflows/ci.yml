name: CI

on:
  push:
  pull_request:

# The release job attaches zips to GitHub releases; the default token is
# read-only in locked-down repos, so request write explicitly.
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++-14 libx11-dev libxrandr-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-cross:
    # Reproducible Windows exe built on Linux (same path as local cross-builds).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake llvm
      - name: Fetch Zig
        run: |
          curl -fSLo zig.tar.xz https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
          tar -xf zig.tar.xz
          echo "ZIG_DIR=$PWD" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build-win --toolchain cmake/toolchain-windows-zig.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-win -j"$(nproc)"
      - name: Verify PE
        run: file build-win/nightscreen.exe
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp build-win/nightscreen.exe .
          python3 -c "import zipfile; z=zipfile.ZipFile('nightscreen-windows-x64.zip','w',zipfile.ZIP_DEFLATED); z.write('nightscreen.exe','nightscreen.exe'); z.close()"
          sha256sum nightscreen-windows-x64.zip nightscreen.exe > SHA256SUMS.txt
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nightscreen-windows-x64.zip
            SHA256SUMS.txt
